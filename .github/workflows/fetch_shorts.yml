name: Auto Fetch 10k Shorts IDs

on:
  workflow_dispatch: # Manual trigger button ke liye
  push:
    branches: [ main ] # Jab bhi code push ho yeh chal pare

jobs:
  fetch-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run Scraping Script
        run: |
          queries=("shorts" "funny shorts" "gaming shorts" "trending shorts" "viral shorts" "entertainment")
          > raw_ids.txt
          for q in "${queries[@]}"; do
              echo "Fetching from search topic: $q ..."
              yt-dlp --flat-playlist --playlist-end 2000 --get-id "ytsearch2000:$q shorts" >> raw_ids.txt || true
          done
          sort -u raw_ids.txt | shuf | head -n 10000 | sed 's/.*/"&",/' > shorts_array.txt
          rm raw_ids.txt

      - name: Commit & Push generated shorts_array.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shorts_array.txt
          git commit -m "Auto-generated 10,000 shorts array" || exit 0
          git push

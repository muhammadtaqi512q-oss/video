name: Auto Fetch 10k Shorts IDs

on:
  workflow_dispatch: # Manual trigger button ke liye
  push:
    branches: [ main ] # Jab bhi code push ho yeh chal pare

jobs:
  fetch-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run Scraping Script
        run: |
          # 1. Existing file se purani IDs Extract karein (Clean raw format mein)
          > existing_ids.txt
          if [ -f "shorts_array.txt" ]; then
              echo "Existing shorts_array.txt found. Preserving old IDs..."
              sed 's/[",]//g' shorts_array.txt | tr -d ' ' > existing_ids.txt
          fi

          # 2. Naye topics aur categories include karein
          queries=(
            "beautiful places shorts" 
            "dramas shorts" 
            "nature shorts"
          )

          > new_ids.txt
          for q in "${queries[@]}"; do
              echo "Fetching from search topic: $q ..."
              yt-dlp --flat-playlist --playlist-end 2500 --get-id "ytsearch2500:$q" >> new_ids.txt || true
          done

          # 3. Purani aur Nayi IDs ko merge karein aur duplicates remove karein
          cat existing_ids.txt new_ids.txt | grep -v '^$' | sort -u | shuf | head -n 10000 | sed 's/.*/"&",/' > shorts_array.txt

          # 4. Temporary cleanup
          rm -f existing_ids.txt new_ids.txt

          echo "Done! Duplicate-free IDs updated in shorts_array.txt"

      - name: Commit & Push generated shorts_array.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add shorts_array.txt
          git commit -m "Auto-append beautiful places, dramas & nature shorts with deduplication" || exit 0
          git push

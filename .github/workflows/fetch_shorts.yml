name: Download Offline YouTube Shorts MP4

on:
  workflow_dispatch:

jobs:
  download-videos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install yt-dlp & ffmpeg
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Download Shorts (Max 60 Seconds & Vertical Only)
        run: |
          mkdir -p videos
          
          # Max 60 sec duration + Vertical Aspect Ratio (Shorts) + Low storage 480p/720p format
          yt-dlp --max-downloads 50 \
            --match-filter "duration <= 60 & height >= width" \
            -f "b[filesize<15M][ext=mp4]/b[ext=mp4]/best" \
            -o "videos/%(id)s.mp4" \
            "ytsearch100:nature shorts"

          # Automatically JavaScript Array File Generator
          echo "const localVideos = [" > video_array.js
          for file in videos/*.mp4; do
            if [ -f "$file" ]; then
              echo "  \"$file\"," >> video_array.js
            fi
          done
          echo "];" >> video_array.js

      - name: Commit & Push MP4 Videos
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add videos/ video_array.js
          git commit -m "Auto-download max 60s offline shorts" || exit 0
          git push

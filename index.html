<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyMix - Ultra Dynamic Hub</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0f0f0f;
            color: #f1f1f1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Top Bar Header */
        header {
            width: 100%;
            height: 60px;
            background: #0f0f0f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .logo-icon {
            color: #ff0000;
            font-size: 26px;
        }

        .creator-link {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        .creator-link:hover {
            background: #ff0000;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.5);
        }

        /* Category Filter Bar */
        .category-bar {
            width: 100%;
            padding: 12px 20px;
            background: #0f0f0f;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            position: sticky;
            top: 60px;
            z-index: 90;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: rgba(255, 255, 255, 0.1);
            color: #f1f1f1;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chip.active, .chip:hover {
            background: #f1f1f1;
            color: #0f0f0f;
        }

        /* Content Grid */
        main {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .grid-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: #181818;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .thumbnail {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #282828;
        }

        .thumbnail i.play-icon {
            font-size: 48px;
            color: #ff0000;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.8));
        }

        .card:hover .thumbnail i.play-icon {
            transform: scale(1.15);
        }

        .badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-details {
            padding: 14px;
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            flex-shrink: 0;
        }

        .info h3 {
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info p {
            font-size: 13px;
            color: #aaa;
        }

        /* Player Modal Window */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .player-container {
            width: 95%;
            max-width: 480px;
            height: 85vh;
            background: #000;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
        }

        /* Full Page Mode Modifier */
        .player-container.fullscreen-mode {
            width: 100vw !important;
            max-width: 100vw !important;
            height: 100vh !important;
            border-radius: 0 !important;
            border: none !important;
        }

        .controls-overlay {
            position: absolute;
            top: 12px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 1001;
        }

        .action-btn {
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.65);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: background 0.2s ease;
        }

        .action-btn:hover {
            background: #ff0000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="logo-box">
            <i class="fa-brands fa-youtube logo-icon"></i> JoyMix
        </div>
        <a href="2.html" class="creator-link">
            <i class="fa-solid fa-circle-user"></i> Created by Muhammad Taqi
        </a>
    </header>

    <!-- Categories -->
    <div class="category-bar">
        <button class="chip active" onclick="filterCategory('all', this)"><i class="fa-solid fa-house"></i> All</button>
        <button class="chip" onclick="filterCategory('games', this)"><i class="fa-solid fa-gamepad"></i> Games</button>
        <button class="chip" onclick="filterCategory('videos', this)"><i class="fa-solid fa-film"></i> Videos</button>
        <button class="chip" onclick="filterCategory('images', this)"><i class="fa-solid fa-image"></i> Images</button>
        <button class="chip" onclick="filterCategory('poetry', this)"><i class="fa-solid fa-feather"></i> Poetry</button>
    </div>

    <!-- Main Grid -->
    <main>
        <div class="grid-feed" id="feedGrid">
            <!-- Dynamic Content Load Ho Ga -->
        </div>
    </main>

    <!-- Modal Viewport -->
    <div class="player-modal" id="playerModal">
        <div class="player-container" id="playerContainer">
            <div class="controls-overlay">
                <span class="action-btn" onclick="toggleFullScreen()" title="Full Page Mode">
                    <i class="fa-solid fa-expand" id="fullIcon"></i>
                </span>
                <span class="action-btn" onclick="closePlayer()" title="Close">
                    <i class="fa-solid fa-xmark"></i>
                </span>
            </div>
            <iframe id="mainFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // Local Games & Static Media Config
        const staticItems = [
            { type: 'games', title: '50 Game Classic', path: 'games/50.html', icon: 'fa-trophy', bg: 'fa-gamepad' },
            { type: 'games', title: 'Flappy Bird Arcade', path: 'games/Flappy-Bird.html', icon: 'fa-dove', bg: 'fa-crow' },
            { type: 'games', title: 'Hill Climb Racing', path: 'games/Hill-Climb.html', icon: 'fa-truck', bg: 'fa-car' },
            { type: 'games', title: 'Dino Runner v1', path: 'games/diano1.html', icon: 'fa-paw', bg: 'fa-dragon' },
            { type: 'games', title: 'Dino Runner v2', path: 'games/diano2.html', icon: 'fa-dragon', bg: 'fa-dragon' },
            { type: 'games', title: 'Ludo Star Online', path: 'games/ludo.html', icon: 'fa-dice-four', bg: 'fa-dice' },
            { type: 'games', title: 'Stickman Hero', path: 'games/stickman.html', icon: 'fa-user-ninja', bg: 'fa-person-running' },
            { type: 'games', title: 'Rock Paper Scissors', path: 'games/stone-paper-seasor.html', icon: 'fa-hand-back-fist', bg: 'fa-hand' },
            { type: 'games', title: 'Tic Tac Toe Pro', path: 'games/tic-cros-2.html', icon: 'fa-xmark', bg: 'fa-hashtag' },
            { type: 'images', title: 'Online Gallery Stream', path: 'image/online.html', icon: 'fa-camera', bg: 'fa-globe' },
            { type: 'poetry', title: 'Poetry Cards & Quotes', path: 'image/poetry.html', icon: 'fa-book-open', bg: 'fa-feather' },
            { type: 'images', title: 'Offline Image Storage', path: 'image/offline.html', icon: 'fa-box-archive', bg: 'fa-hard-drive' }
        ];

        // Fetch `shorts_array.txt` IDs dynamically
        async function loadFeed() {
            const grid = document.getElementById('feedGrid');
            let videoIds = [];

            try {
                const response = await fetch('shorts_array.txt');
                if (response.ok) {
                    const text = await response.text();
                    videoIds = text.replace(/[\[\]\r"]/g, '').split('\n').map(id => id.trim()).filter(id => id.length > 0);
                }
            } catch (e) {
                console.log("Fetch fallback active.");
            }

            let allCards = [];

            // Add Static Local Items
            staticItems.forEach(item => {
                allCards.push({
                    category: item.type,
                    html: `
                        <div class="card item-${item.type}" onclick="playContent('${item.path}')">
                            <div class="thumbnail">
                                <i class="fa-solid ${item.bg} play-icon"></i>
                                <span class="badge">${item.type.toUpperCase()}</span>
                            </div>
                            <div class="card-details">
                                <div class="avatar"><i class="fa-solid ${item.icon}"></i></div>
                                <div class="info">
                                    <h3>${item.title}</h3>
                                    <p>JoyMix • Play Now</p>
                                </div>
                            </div>
                        </div>`
                });
            });

            // Add Dynamic Shorts Videos from txt
            if (videoIds.length > 0) {
                const shuffled = videoIds.sort(() => 0.5 - Math.random()).slice(0, 12);
                shuffled.forEach((vid, index) => {
                    const thumbUrl = `https://img.youtube.com/vi/${vid}/hqdefault.jpg`;
                    const embedUrl = `https://www.youtube.com/embed/${vid}?autoplay=1`;

                    allCards.push({
                        category: 'videos',
                        html: `
                            <div class="card item-videos" onclick="playContent('${embedUrl}')">
                                <div class="thumbnail" style="background-image: url('${thumbUrl}');">
                                    <i class="fa-solid fa-play play-icon"></i>
                                    <span class="badge" style="background:#ff0000;">SHORTS</span>
                                </div>
                                <div class="card-details">
                                    <div class="avatar"><i class="fa-brands fa-youtube"></i></div>
                                    <div class="info">
                                        <h3>Featured Video #${index + 1}</h3>
                                        <p>JoyMix Videos Feed</p>
                                    </div>
                                </div>
                            </div>`
                    });
                });
            }

            allCards.sort(() => 0.5 - Math.random());
            grid.innerHTML = allCards.map(c => c.html).join('');
        }

        // Filter Category
        function filterCategory(category, el) {
            document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                if (category === 'all') {
                    card.style.display = 'flex';
                } else if (card.classList.contains('item-' + category)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Open Content Viewer
        function playContent(path) {
            document.getElementById('mainFrame').src = path;
            document.getElementById('playerModal').style.display = 'flex';
        }

        // Toggle Full Page Mode (100% Fullscreen View)
        function toggleFullScreen() {
            const container = document.getElementById('playerContainer');
            const icon = document.getElementById('fullIcon');
            container.classList.toggle('fullscreen-mode');

            if (container.classList.contains('fullscreen-mode')) {
                icon.className = 'fa-solid fa-compress';
            } else {
                icon.className = 'fa-solid fa-expand';
            }
        }

        // Close Player & Reset Layout
        function closePlayer() {
            document.getElementById('mainFrame').src = '';
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('playerContainer').classList.remove('fullscreen-mode');
            document.getElementById('fullIcon').className = 'fa-solid fa-expand';
        }

        loadFeed();
    </script>
</body>
</html>

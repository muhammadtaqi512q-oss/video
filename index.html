<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoyMix - Fullscreen YouTube Experience</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #181818;
            --text-color: #f1f1f1;
            --subtext-color: #aaa;
            --border-color: rgba(255, 255, 255, 0.1);
            --chip-bg: rgba(255, 255, 255, 0.1);
            --chip-hover-bg: #f1f1f1;
            --chip-hover-text: #0f0f0f;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }

        body.light-theme {
            --bg-color: #ffffff;
            --card-bg: #f9f9f9;
            --text-color: #0f0f0f;
            --subtext-color: #606060;
            --border-color: rgba(0, 0, 0, 0.1);
            --chip-bg: rgba(0, 0, 0, 0.05);
            --chip-hover-bg: #0f0f0f;
            --chip-hover-text: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
            user-select: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* Header */
        header {
            width: 100%;
            height: 60px;
            background: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 22px;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.5px;
            cursor: pointer;
            text-decoration: none;
        }

        .logo-icon {
            color: #ff0000;
            font-size: 26px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .theme-toggle-btn {
            background: var(--chip-bg);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid var(--border-color);
            font-size: 18px;
        }

        .creator-link {
            background: var(--chip-bg);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--border-color);
        }

        .creator-link:hover {
            background: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }

        /* Category Filter Bar */
        .category-bar {
            width: 100%;
            padding: 12px 20px;
            background: var(--bg-color);
            display: flex;
            gap: 12px;
            overflow-x: auto;
            position: sticky;
            top: 60px;
            z-index: 90;
            border-bottom: 1px solid var(--border-color);
        }

        .category-bar::-webkit-scrollbar {
            display: none;
        }

        .chip {
            background: var(--chip-bg);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chip.active, .chip:hover {
            background: var(--chip-hover-bg);
            color: var(--chip-hover-text);
        }

        /* Feed Grid */
        main {
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .grid-feed {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border-color);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px var(--shadow-color);
        }

        .thumbnail {
            width: 100%;
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(128, 128, 128, 0.2);
        }

        .thumbnail i.play-icon {
            font-size: 48px;
            color: #ff0000;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
        }

        .badge {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-details {
            padding: 14px;
            display: flex;
            gap: 12px;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--chip-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: var(--text-color);
            flex-shrink: 0;
        }

        .info h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-color);
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .info p {
            font-size: 13px;
            color: var(--subtext-color);
        }

        /* Mobile Fullscreen Viewer */
        .player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .controls-overlay {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 12px;
            z-index: 1001;
        }

        .action-btn {
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            background: rgba(0, 0, 0, 0.7);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .action-btn:active {
            transform: scale(0.9);
            background: #ff0000;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <a href="2.html" class="logo-box">
            <i class="fa-brands fa-youtube logo-icon"></i> JoyMix
        </a>
        <div class="header-actions">
            <div class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </div>
            <a href="2.html" class="creator-link">
                <i class="fa-solid fa-circle-user"></i> Created by Muhammad Taqi
            </a>
        </div>
    </header>

    <div class="category-bar">
        <button class="chip active" onclick="filterCategory('all', this)"><i class="fa-solid fa-house"></i> All</button>
        <button class="chip" onclick="filterCategory('games', this)"><i class="fa-solid fa-gamepad"></i> Games</button>
        <button class="chip" onclick="filterCategory('videos', this)"><i class="fa-solid fa-film"></i> Videos</button>
        <button class="chip" onclick="filterCategory('images', this)"><i class="fa-solid fa-image"></i> Images</button>
        <button class="chip" onclick="filterCategory('poetry', this)"><i class="fa-solid fa-feather"></i> Poetry</button>
    </div>

    <main>
        <div class="grid-feed" id="feedGrid"></div>
    </main>

    <div class="player-modal" id="playerModal">
        <div class="player-container">
            <div class="controls-overlay">
                <span class="action-btn" id="prevBtn" onclick="prevVideo()" style="display: none;" title="Previous Video">
                    <i class="fa-solid fa-arrow-left"></i>
                </span>
                <span class="action-btn" id="nextBtn" onclick="nextVideo()" style="display: none;" title="Next Video">
                    <i class="fa-solid fa-arrow-right"></i>
                </span>
                <span class="action-btn" onclick="closePlayer()" title="Close">
                    <i class="fa-solid fa-xmark"></i>
                </span>
            </div>
            <iframe id="mainFrame" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
    </div>

    <script src="https://www5.oneapp.dev/script.js"></script>
</body>
</html>

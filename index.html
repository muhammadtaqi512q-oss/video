  // ---------- UTILS ----------
  function getRandomItem(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function extractYouTubeID(url) {
    const match = url.match(/(?:youtube\.com\/watch\?v=)([a-zA-Z0-9_-]+)/);
    return match ? match[1] : null;
  }

  function isYouTubeUrl(url) {
    return url.includes("youtube.com/watch");
  }

  function isEmbedUrl(url) {
    // Gemini, meta.ai, heygen embeds -> show as clickable link
    return url.includes("meta.ai") || url.includes("gemini.google") || url.includes("share.gemini.google") || url.includes("app.heygen.com");
  }

  // ---------- SEARCH LOGIC ----------
  function findMatchingCategory(keyword) {
    const lowerKeyword = keyword.toLowerCase().trim();
    if (!lowerKeyword) return null;

    for (let cat of DATA.categories) {
      // skip the "else" category for initial matching, we use it as fallback
      if (cat.aliases.includes("else") && cat.aliases.length === 1) continue;
      for (let alias of cat.aliases) {
        if (alias.toLowerCase().includes(lowerKeyword) || lowerKeyword.includes(alias.toLowerCase())) {
          return cat;
        }
      }
    }
    return null; // no match found
  }

  function getFallbackCategory() {
    return DATA.categories.find(cat => cat.aliases.includes("else") && cat.aliases.length === 1) || DATA.categories[DATA.categories.length-1];
  }

  function displayResult(url) {
    const container = document.getElementById('resultContainer');
    container.innerHTML = '';

    if (!url) {
      container.innerHTML = '<p class="info-text">⚠️ No link found. Try another keyword.</p>';
      return;
    }

    if (isYouTubeUrl(url)) {
      const videoId = extractYouTubeID(url);
      if (videoId) {
        const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        container.innerHTML = `
          <p style="color:#b388ff; margin-bottom:0.8rem;">🎬 YouTube Video (autoplay)</p>
          <div class="video-wrapper">
            <iframe src="${embedUrl}" allow="autoplay; encrypted-media" allowfullscreen></iframe>
          </div>
        `;
      } else {
        // fallback: show link
        container.innerHTML = `<a href="${url}" target="_blank" class="link-btn">▶️ Open Video</a>`;
      }
    } else if (isEmbedUrl(url) || url.includes("meta.ai") || url.includes("gemini") || url.includes("heygen")) {
      // Clickable link that opens in new tab
      container.innerHTML = `
        <p style="color:#ce93d8;">🔗 Press the button below to open</p>
        <a href="${url}" target="_blank" rel="noopener noreferrer" class="link-btn">Open in Browser</a>
      `;
    } else {
      // any other URL, just open as link
      container.innerHTML = `<a href="${url}" target="_blank" class="link-btn">🌐 Open Link</a>`;
    }
  }

  function handleSearch() {
    const input = document.getElementById('keywordInput').value.trim();
    if (!input) {
      document.getElementById('resultContainer').innerHTML = '<p class="info-text">Please type a keyword.</p>';
      return;
    }

    let category = findMatchingCategory(input);
    let selectedUrl;

    if (category) {
      selectedUrl = getRandomItem(category.urls);
    } else {
      // fallback to "else" category
      const elseCat = getFallbackCategory();
      if (elseCat && elseCat.urls.length > 0) {
        selectedUrl = getRandomItem(elseCat.urls);
        document.getElementById('resultContainer').innerHTML = '<p style="color:#ffb74d; margin-bottom:0.6rem;">🔀 No direct match — showing from Else collection</p>';
      } else {
        selectedUrl = null;
      }
    }

    if (selectedUrl) {
      displayResult(selectedUrl);
    } else {
      document.getElementById('resultContainer').innerHTML = '<p class="info-text">❌ Something went wrong.</p>';
    }
  }

  // ---------- EVENT LISTENERS ----------
  document.getElementById('searchBtn').addEventListener('click', handleSearch);
  document.getElementById('keywordInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') handleSearch();
  });

  document.getElementById('latestVersionBtn').addEventListener('click', () => {
    window.open('https://lyra.oneapp.dev', '_blank', 'noopener');
  });
</script>

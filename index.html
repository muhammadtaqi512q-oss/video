<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYRA – AI Assistant</title>
    <style>
        /* ─── reset & base ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #eef2f7;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .app {
            width: 100%;
            max-width: 820px;
            height: 96vh;
            max-height: 820px;
            background: #141a24;
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #2a3342;
        }

        .header {
            padding: 18px 28px;
            background: #1a212c;
            border-bottom: 1px solid #2a3342;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand .icon {
            font-size: 28px;
        }

        .brand h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #60a5fa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        .brand .tag {
            font-size: 11px;
            background: #2a3342;
            padding: 2px 12px;
            border-radius: 40px;
            color: #94a3b8;
            font-weight: 500;
            -webkit-text-fill-color: #94a3b8;
        }

        .creator {
            font-size: 14px;
            color: #94a3b8;
            cursor: pointer;
            transition: color 0.2s, transform 0.15s;
            padding: 6px 14px;
            border-radius: 40px;
            background: #1f2835;
            border: 1px solid #2a3342;
            user-select: none;
        }

        .creator:hover {
            color: #f1f5f9;
            background: #2a3342;
            border-color: #4a5a72;
            transform: scale(1.02);
        }

        .creator strong {
            color: #a78bfa;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            color: #64748b;
            padding: 4px 12px;
            background: #1f2835;
            border-radius: 40px;
            border: 1px solid #2a3342;
            white-space: nowrap;
        }

        .status.loaded {
            color: #4ade80;
            border-color: #4ade80;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px 8px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar {
            width: 4px;
        }
        .chat::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat::-webkit-scrollbar-thumb {
            background: #2a3342;
            border-radius: 8px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 92%;
            animation: fadeUp 0.35s ease;
        }

        .message.user {
            align-self: flex-end;
        }
        .message.lyra {
            align-self: flex-start;
        }

        .message .bubble {
            padding: 14px 20px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.6;
            word-break: break-word;
        }

        .message.user .bubble {
            background: #3b4b66;
            color: #f1f5f9;
            border-bottom-right-radius: 4px;
        }

        .message.lyra .bubble {
            background: #1f2835;
            border: 1px solid #2a3342;
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }

        .message .label {
            font-size: 11px;
            color: #64748b;
            margin: 0 6px 4px 6px;
            font-weight: 500;
        }

        .message.user .label {
            text-align: right;
        }

        /* result single */
        .result-single {
            margin-top: 6px;
            width: 100%;
        }

        .result-single iframe {
            width: 100%;
            aspect-ratio: 9 / 16;
            max-height: 420px;
            display: block;
            border: none;
            border-radius: 12px;
            background: #0b0e14;
        }

        .result-single .link-item {
            display: block;
            padding: 14px 18px;
            color: #93c5fd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s, color 0.2s;
            word-break: break-all;
            background: #0b0e14;
            border-radius: 12px;
            border: 1px solid #2a3342;
        }

        .result-single .link-item:hover {
            background: #1f2835;
            color: #bfdbfe;
            border-color: #4a5a72;
        }

        .result-single .link-item .badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 600;
            color: #94a3b8;
            background: #1f2835;
            padding: 2px 10px;
            border-radius: 20px;
            margin-left: 8px;
            letter-spacing: 0.3px;
        }

        .result-single .link-item .badge.meta {
            background: #1e293b;
            color: #818cf8;
        }

        .result-single .video-title {
            padding: 10px 14px 12px 14px;
            font-size: 13px;
            color: #cbd5e1;
            background: #0b0e14;
            border-radius: 0 0 12px 12px;
            border: 1px solid #2a3342;
            border-top: none;
            margin-top: -2px;
        }

        .source-tag {
            font-size: 10px;
            color: #64748b;
            margin-top: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .typing .bubble {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 22px;
        }

        .typing .dot {
            width: 8px;
            height: 8px;
            background: #64748b;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        .typing .dot:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%,
            60%,
            100% {
                opacity: 0.25;
                transform: scale(0.85);
            }
            30% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-area {
            padding: 16px 24px 24px 24px;
            background: #141a24;
            border-top: 1px solid #1f2835;
            flex-shrink: 0;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-area input {
            flex: 1;
            padding: 14px 20px;
            border-radius: 60px;
            border: 1px solid #2a3342;
            background: #0b0e14;
            color: #f1f5f9;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-area input::placeholder {
            color: #475569;
        }

        .input-area input:focus {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
        }

        .input-area button {
            padding: 14px 28px;
            border-radius: 60px;
            border: none;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .input-area button:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 24px rgba(124, 58, 237, 0.35);
        }

        .input-area button:active {
            transform: scale(0.97);
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 0 24px 12px 24px;
            flex-shrink: 0;
        }

        .suggestions .chip {
            font-size: 12px;
            padding: 5px 14px;
            border-radius: 40px;
            background: #1a212c;
            border: 1px solid #2a3342;
            color: #94a3b8;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
            user-select: none;
        }

        .suggestions .chip:hover {
            background: #2a3342;
            color: #f1f5f9;
            border-color: #4a5a72;
        }

        @media (max-width: 600px) {
            .app {
                height: 100vh;
                max-height: none;
                border-radius: 16px;
            }
            .header {
                padding: 14px 18px;
            }
            .brand h1 {
                font-size: 18px;
            }
            .brand .tag {
                font-size: 9px;
                padding: 1px 10px;
            }
            .creator {
                font-size: 12px;
                padding: 4px 12px;
            }
            .chat {
                padding: 14px 14px 4px 14px;
            }
            .message .bubble {
                font-size: 14px;
                padding: 12px 16px;
            }
            .input-area {
                padding: 12px 14px 16px 14px;
                flex-wrap: wrap;
            }
            .input-area input {
                font-size: 14px;
                padding: 12px 16px;
            }
            .input-area button {
                padding: 12px 20px;
                font-size: 14px;
            }
            .suggestions {
                padding: 0 14px 8px 14px;
            }
            .suggestions .chip {
                font-size: 10px;
                padding: 4px 10px;
            }
            .result-single iframe {
                aspect-ratio: 9 / 16;
                max-height: 300px;
            }
        }
    </style>
</head>
<body>

    <div class="app">

        <!-- HEADER -->
        <div class="header">
            <div class="brand">
                <span class="icon">✦</span>
                <h1>LYRA</h1>
                <span class="tag">AI</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="status" id="statusBadge">⏳ Loading…</span>
                <div class="creator" id="creatorBtn">by <strong>Muhammad Taqi</strong></div>
            </div>
        </div>

        <!-- SUGGESTIONS -->
        <div class="suggestions" id="suggestions">
            <span class="chip" data-query="funny baby">😂 funny baby</span>
            <span class="chip" data-query="mountain view">🏔️ mountain</span>
            <span class="chip" data-query="desert camel">🐫 desert</span>
            <span class="chip" data-query="army commando">⚔️ army</span>
            <span class="chip" data-query="bmw car">🚗 bmw</span>
            <span class="chip" data-query="ghost story">👻 horror</span>
            <span class="chip" data-query="samurai warrior">⚔️ warrior</span>
            <span class="chip" data-query="giant food">🍔 giant food</span>
            <span class="chip" data-query="futuristic city">🤖 future</span>
        </div>

        <!-- CHAT -->
        <div class="chat" id="chatContainer">
            <div class="message lyra">
                <span class="label">LYRA</span>
                <div class="bubble">
                    👋 Hi! I'm <strong>LYRA</strong>.<br />
                    I'm fetching data from your GitHub databases…<br />
                    <span style="color:#94a3b8; font-size:13px;">Ask me anything once I'm ready.</span>
                </div>
            </div>
        </div>

        <!-- INPUT -->
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask LYRA anything…" disabled />
            <button id="sendBtn" disabled>Ask ✦</button>
        </div>

    </div>

    <script>
        // ═══════════════════════════════════════════════════════════
        //  CONFIG – GitHub raw URLs (your repo)
        // ═══════════════════════════════════════════════════════════
        const BASE_URL = 'https://raw.githubusercontent.com/muhammadtaqi512q-oss/video/main/';
        const DB_URLS = {
            linksMd: BASE_URL + 'links.md',
            data3Json: BASE_URL + 'data3.json',
            dataJson: BASE_URL + 'data.json',
            elseMd: BASE_URL + 'else.md',
            elseJson: BASE_URL + 'ELSE.json'
        };

        // ═══════════════════════════════════════════════════════════
        //  GLOBALS
        // ═══════════════════════════════════════════════════════════
        let db = {
            linksMd: {}, // keyword -> array of iframe src URLs
            data3Json: {}, // alias -> array of meta.ai URLs
            dataJson: {}, // keyword -> array of {title, url}
            elseMd: [], // array of iframe HTML strings
            elseJson: [] // array of meta URLs
        };
        let isLoaded = false;

        const chat = document.getElementById('chatContainer');
        const input = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBadge = document.getElementById('statusBadge');

        // ═══════════════════════════════════════════════════════════
        //  FETCH & PARSE
        // ═══════════════════════════════════════════════════════════

        async function fetchAll() {
            try {
                const [linksMdRaw, data3Raw, dataJsonRaw, elseMdRaw, elseJsonRaw] = await Promise.all([
                    fetch(DB_URLS.linksMd).then(r => r.text()),
                    fetch(DB_URLS.data3Json).then(r => r.json()),
                    fetch(DB_URLS.dataJson).then(r => r.json()),
                    fetch(DB_URLS.elseMd).then(r => r.text()),
                    fetch(DB_URLS.elseJson).then(r => r.json())
                ]);

                db.linksMd = parseLinksMd(linksMdRaw);
                db.data3Json = parseData3Json(data3Raw);
                db.dataJson = parseDataJson(dataJsonRaw);
                db.elseMd = parseElseMd(elseMdRaw);
                db.elseJson = elseJsonRaw;

                isLoaded = true;
                statusBadge.textContent = '✅ Loaded';
                statusBadge.className = 'status loaded';
                input.disabled = false;
                sendBtn.disabled = false;
                input.focus();

                addMessage('lyra', '✅ All databases loaded! Ask me anything.');
            } catch (err) {
                console.error('Fetch error:', err);
                statusBadge.textContent = '❌ Error';
                statusBadge.style.borderColor = '#f87171';
                statusBadge.style.color = '#f87171';
                addMessage('lyra', '⚠️ Failed to load databases. Check console and your GitHub URLs.');
            }
        }

        // ─── parse links.md ──────────────────────────────────────
        function parseLinksMd(text) {
            const lines = text.split('\n').map(l => l.trim()).filter(l => l);
            const result = {};
            let currentKeywords = [];

            for (const line of lines) {
                if (line.includes('&') && !line.includes('<iframe')) {
                    currentKeywords = line.split('&').map(k => k.trim().toLowerCase());
                } else if (line.includes('<iframe') && currentKeywords.length) {
                    const srcMatch = line.match(/src="([^"]+)"/);
                    if (srcMatch) {
                        const src = srcMatch[1];
                        for (const kw of currentKeywords) {
                            if (!result[kw]) result[kw] = [];
                            result[kw].push(src);
                        }
                    }
                } else if (!line.includes('&') && !line.includes('<iframe') && line.length > 0) {
                    currentKeywords = [line.trim().toLowerCase()];
                }
            }
            return result;
        }

        // ─── parse data3.json ────────────────────────────────────
        function parseData3Json(json) {
            const map = {};
            if (!json.categories) return map;
            for (const cat of json.categories) {
                const aliases = cat.aliases || [];
                const urls = cat.urls || [];
                for (const alias of aliases) {
                    const key = alias.toLowerCase();
                    if (!map[key]) map[key] = [];
                    map[key].push(...urls);
                }
            }
            return map;
        }

        // ─── parse data.json ─────────────────────────────────────
        function parseDataJson(json) {
            const map = {};
            if (!Array.isArray(json)) return map;
            for (const cat of json) {
                const keywords = cat.keywords || [];
                const videos = cat.videos || [];
                for (const kw of keywords) {
                    const key = kw.toLowerCase();
                    if (!map[key]) map[key] = [];
                    map[key].push(...videos);
                }
            }
            return map;
        }

        // ─── parse else.md ──────────────────────────────────────
        function parseElseMd(text) {
            return text.split('\n').map(l => l.trim()).filter(l => l.includes('<iframe'));
        }

        // ═══════════════════════════════════════════════════════════
        //  SEARCH ENGINE
        // ═══════════════════════════════════════════════════════════

        function normalize(str) {
            return str.toLowerCase().trim().replace(/\s+/g, ' ');
        }

        function matchKeyword(query, map) {
            const q = normalize(query);
            for (const [key, val] of Object.entries(map)) {
                if (q.includes(normalize(key))) return val;
            }
            return null;
        }

        function pickRandom(arr) {
            if (!arr || arr.length === 0) return null;
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function search(query) {
            const q = normalize(query);
            if (!q) return null;

            // 1️⃣ links.md
            let result = matchKeyword(q, db.linksMd);
            if (result) {
                const picked = pickRandom(result);
                if (picked) return { type: 'frame', data: picked, source: 'links.md' };
            }

            // 2️⃣ data3.json
            result = matchKeyword(q, db.data3Json);
            if (result) {
                const picked = pickRandom(result);
                if (picked) return { type: 'link', data: picked, source: 'data3.json' };
            }

            // 3️⃣ data.json
            result = matchKeyword(q, db.dataJson);
            if (result) {
                const picked = pickRandom(result);
                if (picked) return { type: 'dataJson', data: picked, source: 'data.json' };
            }

            // 4️⃣ else.md or ELSE.json (random)
            const useElseMd = Math.random() < 0.5;
            if (useElseMd && db.elseMd.length) {
                const picked = pickRandom(db.elseMd);
                if (picked) return { type: 'elseMd', data: picked, source: 'else.md' };
            } else if (db.elseJson.length) {
                const picked = pickRandom(db.elseJson);
                if (picked) return { type: 'link', data: picked, source: 'ELSE.json' };
            }

            return null;
        }

        // ─── render result ──────────────────────────────────────
        function renderResult(result, userQuery) {
            if (!result) {
                return `
                    <div class="bubble">
                        🤔 Hmm, I couldn't find anything for "<strong>${escapeHtml(userQuery)}</strong>".<br/>
                        Try something like <em>funny baby, mountain, desert, army, bmw, ghost story, giant food</em> etc.
                    </div>
                `;
            }

            let html = '<div class="result-single">';

            switch (result.type) {
                case 'frame': {
                    const src = result.data;
                    const vid = src.includes('youtube.com/embed/') ? src.split('/embed/')[1]?.split('?')[0] : null;
                    if (vid) {
                        html += `<iframe src="https://www.youtube.com/embed/${vid}" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen loading="lazy"></iframe>`;
                    } else {
                        html += `<iframe src="${src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                    }
                    html += `<div class="source-tag">📁 ${result.source}</div>`;
                    break;
                }
                case 'link': {
                    const url = result.data;
                    const isMeta = url.includes('meta.ai');
                    const badge = isMeta ? 'meta' : 'link';
                    html += `
                        <a href="${url}" target="_blank" rel="noopener" class="link-item">
                            ${url.replace(/^https?:\/\//, '').slice(0, 60)}…
                            <span class="badge ${badge}">${isMeta ? '🔗 meta.ai' : '🔗 link'}</span>
                        </a>
                        <div class="source-tag">📁 ${result.source}</div>`;
                    break;
                }
                case 'dataJson': {
                    const video = result.data;
                    const vid = video.url.includes('watch?v=') ? video.url.split('watch?v=')[1]?.split('&')[0] : null;
                    if (vid) {
                        html += `<iframe src="https://www.youtube.com/embed/${vid}" 
                                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                    allowfullscreen loading="lazy"></iframe>`;
                    } else {
                        html += `<iframe src="${video.url}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                    }
                    html += `<div class="video-title">${escapeHtml(video.title || 'Video')}</div>`;
                    html += `<div class="source-tag">📁 ${result.source}</div>`;
                    break;
                }
                case 'elseMd': {
                    const iframeStr = result.data;
                    const srcMatch = iframeStr.match(/src="([^"]+)"/);
                    const src = srcMatch ? srcMatch[1] : null;
                    if (src) {
                        html += `<iframe src="${src}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
                    } else {
                        html += iframeStr;
                    }
                    html += `<div class="source-tag">📁 ${result.source}</div>`;
                    break;
                }
                default: {
                    html += `<div class="bubble">⚠️ Unexpected result type.</div>`;
                }
            }

            html += '</div>';
            return html;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ─── UI helpers ──────────────────────────────────────────
        function addMessage(role, contentHtml) {
            const wrapper = document.createElement('div');
            wrapper.className = `message ${role}`;
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = role === 'user' ? 'YOU' : 'LYRA';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = contentHtml;
            wrapper.appendChild(label);
            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const wrapper = document.createElement('div');
            wrapper.className = 'message lyra typing';
            wrapper.id = 'typingIndicator';
            const label = document.createElement('div');
            label.className = 'label';
            label.textContent = 'LYRA';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerHTML = `<span class="dot"></span><span class="dot"></span><span class="dot"></span>`;
            wrapper.appendChild(label);
            wrapper.appendChild(bubble);
            chat.appendChild(wrapper);
            chat.scrollTop = chat.scrollHeight;
            return wrapper;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // ─── handle query ──────────────────────────────────────
        function handleQuery(query) {
            const trimmed = query.trim();
            if (!trimmed || !isLoaded) return;

            addMessage('user', escapeHtml(trimmed));
            const typing = addTyping();

            setTimeout(() => {
                removeTyping();
                const result = search(trimmed);
                const html = renderResult(result, trimmed);
                addMessage('lyra', html);
                input.value = '';
                input.focus();
            }, 400 + Math.random() * 300);
        }

        // ─── event listeners ───────────────────────────────────
        sendBtn.addEventListener('click', () => handleQuery(input.value));
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                handleQuery(input.value);
            }
        });

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', () => {
                const q = chip.dataset.query;
                if (q) {
                    input.value = q;
                    handleQuery(q);
                }
            });
        });

        document.getElementById('creatorBtn').addEventListener('click', () => {
            window.open('https://nexura.ai.studio/', '_blank');
        });

        // ─── start ──────────────────────────────────────────────
        fetchAll();

        console.log('✦ LYRA AI Assistant (GitHub DB) - by Muhammad Taqi');
        console.log('✦ Using repo: muhammadtaqi512q-oss/video');
    </script>
